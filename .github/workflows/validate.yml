name: Validate Plannerus deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate shell scripts
        run: bash -n scripts/*
      - name: Validate safe example environment and Compose model
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          cp .env.example "$test_root/runtime.env"
          sed -i 's#POSTGRES_PASSWORD=replace-me#POSTGRES_PASSWORD=offline-only#' "$test_root/runtime.env"
          sed -i 's#replace-me@db#offline-only@db#' "$test_root/runtime.env"
          sed -i 's#SECRET_KEY_BASE=replace-with-at-least-64-random-characters#SECRET_KEY_BASE=offline_only_0000000000000000000000000000000000000000000000000000#' "$test_root/runtime.env"
          sed -i 's#AI_ENV_VERSION_ID=replace-with-secrets-manager-version-id#AI_ENV_VERSION_ID=offline-version-id#' "$test_root/runtime.env"
          sed -i "s#AI_ENV_FILE=.*#AI_ENV_FILE=$test_root/ai.env#" "$test_root/runtime.env"
          sed -i "s#AI_LOG_PATH=.*#AI_LOG_PATH=$test_root/ai-logs#" "$test_root/runtime.env"
          bash scripts/environment validate "$test_root/runtime.env"
          cp "$test_root/runtime.env" "$test_root/bad.env"
          sed -i 's#OPDATA=/home/ubuntu/plannerus-deployment/opdata/files#OPDATA=/tmp/empty#' "$test_root/bad.env"
          if bash scripts/environment validate "$test_root/bad.env"; then
            echo 'unsafe persistent-data path was accepted' >&2
            exit 1
          fi
          sed -i "s#DEPLOY_STATE_DIR=.*#DEPLOY_STATE_DIR=$test_root#" "$test_root/runtime.env"
          printf '%s\n' \
            'PORT=5000' \
            'APPLICATION_NAME=Plannerus' \
            'SECRET_SERVER_KEY=offline-only' \
            'GOOGLE_API_KEY=offline-only' \
            'GOOGLE_AI_MODEL=offline-only' \
            'OPENAI_API_KEY=' \
            'OPENAI_AI_MODEL=offline-only' \
            'OPENROUTER_API_KEY=' \
            'OPENROUTER_API_URL=https://example.invalid' \
            'OPENROUTER_AI_MODEL=offline-only' >"$test_root/ai.env"
          bash scripts/environment validate-ai "$test_root/ai.env"
          install -d "$test_root/ai-logs" "$test_root/proxy"
          printf 'PLANNERUS_BLUE_IMAGE=%s\nPLANNERUS_GREEN_IMAGE=%s\nCANDIDATE_IMAGE=%s\nPLANNERUS_BLUE_AI_IMAGE=%s\nPLANNERUS_GREEN_AI_IMAGE=%s\n' \
            '583909165557.dkr.ecr.eu-west-1.amazonaws.com/plannerus/blue-openproject@sha256:b2742542593566944bf77b5db8a7a4f45d4803738efc7984b282ee73a978990f' \
            '583909165557.dkr.ecr.eu-west-1.amazonaws.com/plannerus/blue-openproject@sha256:b2742542593566944bf77b5db8a7a4f45d4803738efc7984b282ee73a978990f' \
            '583909165557.dkr.ecr.eu-west-1.amazonaws.com/plannerus/blue-openproject@sha256:b2742542593566944bf77b5db8a7a4f45d4803738efc7984b282ee73a978990f' \
            '583909165557.dkr.ecr.eu-west-1.amazonaws.com/plannerus/blue-ai@sha256:6f0b66645e9834ad9a0981ca8b5e111e5e33f9052ad455c97254153387d19b05' \
            '583909165557.dkr.ecr.eu-west-1.amazonaws.com/plannerus/blue-ai@sha256:6f0b66645e9834ad9a0981ca8b5e111e5e33f9052ad455c97254153387d19b05' \
            >"$test_root/images.env"
          DEPLOY_STATE_DIR="$test_root" docker compose \
            --env-file "$test_root/runtime.env" --env-file "$test_root/images.env" \
            --profile blue --profile green --profile migration config >"$test_root/rendered.yml"
          ruby -ryaml -e '
            config = YAML.load_file(ARGV.fetch(0))
            services = config.fetch("services")
            expected = %w[ai-blue ai-green cache db migrate proxy web-blue web-green worker-blue worker-green]
            abort "unexpected services" unless services.keys.sort == expected.sort
            abort "web cannot reach data" unless services.dig("web-blue", "networks").keys.sort == %w[backend frontend]
            abort "AI can reach data" unless services.dig("ai-blue", "networks").keys == ["frontend"]
            abort "blue AI routing mismatch" unless services.dig("web-blue", "environment", "PLANNERUS_AI_SERVICE_URL") == "http://ai-blue:5000"
            abort "green AI routing mismatch" unless services.dig("web-green", "environment", "PLANNERUS_AI_SERVICE_URL") == "http://ai-green:5000"
            published = services.values.flat_map { |service| service.fetch("ports", []) }
            abort "non-proxy port published" unless published == services.fetch("proxy").fetch("ports")
          ' "$test_root/rendered.yml"
      - name: Validate the pinned Caddy configuration
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          printf 'respond "offline validation" 503\n' >"$test_root/upstream.caddy"
          docker run --rm \
            -e CADDY_ACME_EMAIL=ops@example.com \
            -v "$PWD/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$test_root:/etc/caddy/state:ro" \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb \
            caddy validate --config /etc/caddy/Caddyfile
