name: plannerus-blue

x-runtime-logging: &runtime_logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-app-environment: &app_environment
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-true}
  OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME:-app.plannerus.com}
  OPENPROJECT_HSTS: ${OPENPROJECT_HSTS:-true}
  OPENPROJECT_RAILS__RELATIVE__URL__ROOT: ""
  OPENPROJECT_ATTACHMENTS__STORAGE__PATH: /var/openproject/assets
  OPENPROJECT_RAILS__CACHE__STORE: memcache
  OPENPROJECT_CACHE__MEMCACHE__SERVER: cache:11211
  OPENPROJECT_WEB_WORKERS: ${OPENPROJECT_WEB_WORKERS:-2}
  RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
  OPENPROJECT_EMAIL__DELIVERY__METHOD: ${OPENPROJECT_EMAIL__DELIVERY__METHOD:-smtp}
  OPENPROJECT_SMTP__ADDRESS: ${OPENPROJECT_SMTP__ADDRESS:-}
  OPENPROJECT_SMTP__PORT: ${OPENPROJECT_SMTP__PORT:-587}
  OPENPROJECT_SMTP__DOMAIN: ${OPENPROJECT_SMTP__DOMAIN:-}
  OPENPROJECT_SMTP__AUTHENTICATION: ${OPENPROJECT_SMTP__AUTHENTICATION:-plain}
  OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: ${OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO:-true}
  OPENPROJECT_SMTP__USER__NAME: ${OPENPROJECT_SMTP__USER__NAME:-}
  OPENPROJECT_SMTP__PASSWORD: ${OPENPROJECT_SMTP__PASSWORD:-}
  OPENPROJECT_GOOD__JOB__ENABLE__CRON: ${OPENPROJECT_GOOD__JOB__ENABLE__CRON:-false}
  IMAP_ENABLED: ${IMAP_ENABLED:-false}

x-app-common: &app_common
  restart: unless-stopped
  stop_grace_period: 45s
  logging: *runtime_logging
  environment: *app_environment
  volumes:
    - type: bind
      source: ${OPDATA:?OPDATA is required}
      target: /var/openproject/assets

x-web-common: &web_common
  <<: *app_common
  command: ./docker/prod/web
  networks: [frontend, backend]
  healthcheck:
    test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health_checks/default]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 90s

x-worker-common: &worker_common
  <<: *app_common
  command: ./docker/prod/worker
  networks: [backend]

x-ai-common: &ai_common
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  logging: *runtime_logging
  env_file:
    - ${AI_ENV_FILE:-/home/ubuntu/plannerus-deployment/backend/.env.production}
  volumes:
    - type: bind
      source: ${AI_LOG_PATH:-/home/ubuntu/plannerus-deployment/backend/logs}
      target: /backend/logs
  networks: [frontend]
  healthcheck:
    test: [CMD, node, -e, "const s=require('net').connect(5000,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  db:
    image: postgres:17@sha256:2cd82735a36356842d5eb1ef80db3ae8f1154172f0f653db48fde079b2a0b7f7
    restart: unless-stopped
    stop_grace_period: 90s
    logging: *runtime_logging
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  cache:
    image: memcached@sha256:8919d18272bacd8f07d87a4f447a2f758b94ed08c314e5ad73b47cb6fc610045
    restart: unless-stopped
    logging: *runtime_logging
    networks: [backend]

  migrate:
    <<: *app_common
    image: ${CANDIDATE_IMAGE:?CANDIDATE_IMAGE is required}
    profiles: [migration]
    restart: "no"
    command: ./docker/prod/seeder
    networks: [backend]

  web-blue:
    <<: *web_common
    image: ${PLANNERUS_BLUE_IMAGE:?PLANNERUS_BLUE_IMAGE is required}
    profiles: [blue]
    environment:
      <<: *app_environment
      PLANNERUS_AI_SERVICE_URL: http://ai-blue:5000

  worker-blue:
    <<: *worker_common
    image: ${PLANNERUS_BLUE_IMAGE:?PLANNERUS_BLUE_IMAGE is required}
    profiles: [blue]
    environment:
      <<: *app_environment
      PLANNERUS_AI_SERVICE_URL: http://ai-blue:5000

  web-green:
    <<: *web_common
    image: ${PLANNERUS_GREEN_IMAGE:?PLANNERUS_GREEN_IMAGE is required}
    profiles: [green]
    environment:
      <<: *app_environment
      PLANNERUS_AI_SERVICE_URL: http://ai-green:5000

  worker-green:
    <<: *worker_common
    image: ${PLANNERUS_GREEN_IMAGE:?PLANNERUS_GREEN_IMAGE is required}
    profiles: [green]
    environment:
      <<: *app_environment
      PLANNERUS_AI_SERVICE_URL: http://ai-green:5000

  ai-blue:
    image: ${PLANNERUS_BLUE_AI_IMAGE:?PLANNERUS_BLUE_AI_IMAGE is required}
    profiles: [blue]
    <<: *ai_common

  ai-green:
    image: ${PLANNERUS_GREEN_AI_IMAGE:?PLANNERUS_GREEN_AI_IMAGE is required}
    profiles: [green]
    <<: *ai_common

  proxy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *runtime_logging
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_STATE_DIR:?DEPLOY_STATE_DIR is required}/proxy:/etc/caddy/state:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

networks:
  frontend:
    name: plannerus-blue_frontend
  backend:
    name: plannerus-blue_backend

volumes:
  pgdata:
    external: true
    name: plannerus-blue_pgdata-new
  caddy_data:
    external: true
    name: plannerus-blue_caddy_data
  caddy_config:
    external: true
    name: plannerus-blue_caddy_config
